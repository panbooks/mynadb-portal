<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">06 / 通过结果验证路由</title><desc id="desc">使用有稳定标识的数据，与不裁剪的可信结果比较。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718698"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#18364a">06 / 通过结果验证路由</text>
<text x="40" y="96" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#536a7b">使用有稳定标识的数据，与不裁剪的可信结果比较。</text>
<polyline points="40,116 1160,116" fill="none" stroke="#718698" stroke-width="2"/>
<text x="40" y="716" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#536a7b">MynaDB · 从零实现系列 08 · 表所有权与分区路由</text>
<rect x="40" y="170" width="330" height="135" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="114.0" y="228.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">多 owner / 迟到数据</text>
<text x="155.0" y="260.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">验证完整性</text>
<rect x="435" y="170" width="330" height="135" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="511.6" y="228.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">节点故障 / 文件变化</text>
<text x="530.0" y="260.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">验证回退与失效</text>
<rect x="830" y="170" width="330" height="135" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="926.6" y="228.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">聚合 / 日期边界</text>
<text x="931.3" y="260.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">验证 SQL 语义</text>
<polyline points="370,237 435,237" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="765,237 830,237" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="470" width="1120" height="115" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="390.0" y="535.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">这些是建议的测试场景，不是已执行的结果。</text>
</svg>
