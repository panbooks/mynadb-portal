<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">02 / 一行协议如何映射到一张表</title><desc id="desc">先约定表名映射，再让 tags、fields 和时间戳进入统一数据模型。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718698"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#18364a">02 / 一行协议如何映射到一张表</text>
<text x="40" y="96" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#536a7b">先约定表名映射，再让 tags、fields 和时间戳进入统一数据模型。</text>
<polyline points="40,116 1160,116" fill="none" stroke="#718698" stroke-width="2"/>
<text x="40" y="716" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#536a7b">MynaDB · 从0到1实现一个分布式时序数据库 01 · 单机基础设计</text>
<rect x="40" y="150" width="1120" height="90" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="506.8" y="186.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">POST /write/demo</text>
<text x="312.5" y="219.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">cpu,service=web,host=server01 usage=23.5 &lt;timestamp&gt;</text>
<rect x="40" y="310" width="330" height="100" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="146.0" y="351.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">URL 中的 db</text>
<text x="128.0" y="384.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">catalog = demo</text>
<rect x="435" y="310" width="330" height="100" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="541.2" y="351.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">service 标签</text>
<text x="529.2" y="384.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">schema = web</text>
<rect x="830" y="310" width="330" height="100" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="924.5" y="351.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">measurement</text>
<text x="940.0" y="384.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">table = cpu</text>
<polyline points="205,240 205,310" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="600,240 600,310" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="995,240 995,310" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="490" width="1120" height="82" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="250.5" y="539.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="500" fill="#18364a">逻辑表 demo.web.cpu → data/demo/web/cpu/date=2025-12-27/</text>
<polyline points="205,410 205,490" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="600,410 600,490" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="995,410 995,490" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="600" width="1120" height="64" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="285.5" y="639.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">timestamp → 时间列与日期分区；tags → 字符串列；usage → 浮点列</text>
</svg>
