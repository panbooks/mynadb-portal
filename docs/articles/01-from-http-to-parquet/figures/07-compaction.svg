<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">07 / Compaction：合并小文件，管理有效文件集合</title><desc id="desc">读出批次、写入大文件，再切换可见文件集合并回收旧文件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718698"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#18364a">07 / Compaction：合并小文件，管理有效文件集合</text>
<text x="40" y="96" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#536a7b">读出批次、写入大文件，再切换可见文件集合并回收旧文件。</text>
<polyline points="40,116 1160,116" fill="none" stroke="#718698" stroke-width="2"/>
<text x="40" y="736" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#536a7b">MynaDB · 从零实现系列 01 · 单机基础设计</text>
<rect x="40" y="160" width="300" height="160" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="113.2" y="213.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="500" fill="#18364a">L0_a.parquet</text>
<text x="112.8" y="249.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="500" fill="#18364a">L0_b.parquet</text>
<text x="114.0" y="285.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="500" fill="#18364a">L0_c.parquet</text>
<rect x="450" y="185" width="300" height="110" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="552.0" y="231.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="500" fill="#18364a">读取批次</text>
<text x="528.8" y="267.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="500" fill="#18364a">对齐 schema</text>
<rect x="860" y="185" width="300" height="110" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="929.5" y="231.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="500" fill="#18364a">写入下一层文件</text>
<text x="919.8" y="266.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="500" fill="#18364a">L1_new.parquet</text>
<polyline points="340,240 450,240" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,240 860,240" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="408" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="500" fill="#18364a">文件生命周期</text>
<rect x="40" y="450" width="300" height="120" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="137.5" y="501.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">写入新文件</text>
<text x="127.0" y="534.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">保留输入文件</text>
<rect x="450" y="450" width="300" height="120" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="516.0" y="501.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">切换有效文件集合</text>
<text x="516.0" y="534.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">查询只读有效文件</text>
<rect x="860" y="450" width="300" height="120" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="957.5" y="501.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">回收旧文件</text>
<text x="947.0" y="534.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">完成本次合并</text>
<polyline points="340,510 450,510" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,510 860,510" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="625" width="1120" height="65" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="290.0" y="664.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">核心约束：每条记录只读一次；有效文件切换与旧文件回收需要协调。</text>
</svg>
