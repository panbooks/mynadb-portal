<text x="123.0" y="251.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">解析指标</text>
<rect x="330" y="170" width="250" height="115" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="401.6" y="218.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">Arrow 批次</text>
<text x="392.0" y="251.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">分片内存缓存</text>
<rect x="620" y="170" width="250" height="115" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="720.2" y="218.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">flush</text>
<text x="682.1" y="251.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">编码 Parquet</text>
<rect x="910" y="170" width="250" height="115" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="973.2" y="218.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">Storage::put</text>
<text x="984.2" y="251.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">本地 / 对象</text>
<polyline points="290,227 330,227" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="580,227 620,227" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="870,227 910,227" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="445" width="520" height="120" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="201.0" y="496.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">缓存分片减少锁竞争</text>
<text x="194.5" y="530.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">周期或容量触发 flush</text>
<rect x="640" y="445" width="520" height="120" rx="13" fill="#fff4e8" stroke="#e1a76a" stroke-width="2"/>
<text x="812.0" y="496.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">单个对象写入成功</text>
<text x="779.0" y="530.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">不等于整批数据原子提交</text>
<rect x="40" y="630" width="1120" height="65" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
