<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">06 / 合并文件还要切换有效集合</title><desc id="desc">图示为安全设计检查项，不代表历史标签已实现事务性合并。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718698"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#18364a">06 / 合并文件还要切换有效集合</text>
<text x="40" y="96" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#536a7b">图示为安全设计检查项，不代表历史标签已实现事务性合并。</text>
<polyline points="40,116 1160,116" fill="none" stroke="#718698" stroke-width="2"/>
<text x="40" y="776" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#536a7b">MynaDB · 从0到1实现一个分布式时序数据库 04 · 对象存储与查询</text>
<rect x="40" y="175" width="300" height="120" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="135.0" y="226.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">旧文件集合</text>
<text x="115.0" y="260.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">小文件 A / B / C</text>
<rect x="450" y="175" width="300" height="120" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="545.0" y="226.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">生成并验证</text>
<text x="534.8" y="260.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">新候选文件 D</text>
<rect x="860" y="175" width="300" height="120" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="936.5" y="226.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">发布新文件集合</text>
<text x="936.5" y="259.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">查询读取新版本</text>
<polyline points="340,235 450,235" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,235 860,235" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="470" width="520" height="120" rx="13" fill="#fff4e8" stroke="#e1a76a" stroke-width="2"/>
<text x="205.5" y="521.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">失败：旧文件仍可读</text>
<text x="205.5" y="554.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">清理未提交候选对象</text>
<rect x="640" y="470" width="520" height="120" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="805.5" y="521.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">等待旧版本读者完成</text>
<text x="805.5" y="554.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">再按规则回收旧文件</text>
<rect x="40" y="650" width="1120" height="65" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="400.5" y="690.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">避免新旧文件同时计入，或在切换时漏读。</text>
</svg>
