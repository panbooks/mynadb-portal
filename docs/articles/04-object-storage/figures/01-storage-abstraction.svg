<text x="428.8" y="211.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="500" fill="#18364a">写入、查询、WAL、Compaction</text>
<rect x="360" y="330" width="480" height="105" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="445.3" y="373.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">Storage：put / get / list / delete</text>
<text x="505.5" y="406.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">路径前缀与后端配置</text>
<polyline points="600,250 600,330" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
