<text x="215.0" y="617.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">文件与目录</text>
<rect x="700" y="540" width="460" height="105" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="852.3" y="583.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">S3 兼容对象存储</text>
<text x="811.1" y="616.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">bucket + key + endpoint</text>
