<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">03 / 复制进度与 flush checkpoint</title><desc id="desc">只有可靠提交的连续范围，才能作为安全清理的依据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718698"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#18364a">03 / 复制进度与 flush checkpoint</text>
<text x="40" y="96" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#536a7b">只有可靠提交的连续范围，才能作为安全清理的依据。</text>
<polyline points="40,116 1160,116" fill="none" stroke="#718698" stroke-width="2"/>
<text x="40" y="716" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#536a7b">MynaDB · 从零实现系列 07 · 备用节点与安全缩容</text>
<rect x="40" y="170" width="330" height="135" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="165.0" y="228.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">复制批次</text>
<text x="156.3" y="260.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">101 至 105</text>
<rect x="435" y="170" width="330" height="135" rx="13" fill="#e9f7f3" stroke="#75b6a7" stroke-width="2"/>
<text x="550.0" y="228.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">已提交边界</text>
<text x="530.7" y="260.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">连续范围至 103</text>
<rect x="830" y="170" width="330" height="135" rx="13" fill="#edf5ff" stroke="#80acd8" stroke-width="2"/>
<text x="955.0" y="228.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">备用缓存</text>
<text x="925.7" y="260.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">考虑清理至 103</text>
<polyline points="370,237 435,237" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="765,237 830,237" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="470" width="1120" height="115" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="351.7" y="535.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">104、105 应保留；消息乱序、丢失和失败需要验证。</text>
</svg>
