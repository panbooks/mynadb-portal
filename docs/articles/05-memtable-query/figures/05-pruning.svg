<text x="935.0" y="260.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#18364a">读取需要的列</text>
<polyline points="370,237 435,237" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="765,237 830,237" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="470" width="1120" height="115" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="358.5" y="535.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="500" fill="#18364a">无法安全判断时保守读取；非精确过滤需再次检查。</text>
