<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">05 / 尽早缩小需要读取的数据</title><desc id="desc">裁剪是优化，不能改变 SQL 的最终结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718698"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#18364a">05 / 尽早缩小需要读取的数据</text>
<text x="40" y="96" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#536a7b">裁剪是优化，不能改变 SQL 的最终结果。</text>
<polyline points="40,116 1160,116" fill="none" stroke="#718698" stroke-width="2"/>
