<text x="917.8" y="240.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">接收 + 本地状态</text>
<polyline points="280,215 390,215" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="720,215 830,215" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<text x="735" y="188" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="500" fill="#536a7b">复制记录</text>
<rect x="390" y="390" width="330" height="100" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="513.6" y="431.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">Parquet</text>
<text x="500.0" y="465.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">批量持久化</text>
<rect x="830" y="390" width="330" height="100" rx="13" fill="#f3f5f8" stroke="#bdcbd5" stroke-width="2"/>
<text x="940.0" y="431.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">从节点存储</text>
<text x="918.0" y="465.0" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">进度取决于协议</text>
<polyline points="555,270 555,390" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="995,270 995,390" fill="none" stroke="#718698" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="580" width="1120" height="85" rx="13" fill="#fff4e8" stroke="#e1a76a" stroke-width="2"/>
<text x="292.0" y="630.5" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="500" fill="#18364a">复制提供另一份数据来源；确认边界和安全切换仍需协议约束。</text>
